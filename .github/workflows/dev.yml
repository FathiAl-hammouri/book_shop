name: Dev Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: "dummy-secret-key"
          POSTGRES_DB: "dummy"
          POSTGRES_USER: "dummy"
          POSTGRES_PASSWORD: "dummy"

      - name: Build artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/app-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='*.pyc' \
            --exclude='artifacts' \
            .

      - name: Commit artifact to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add artifact app-${{ github.sha }}.tar.gz"
          file_pattern: artifacts/

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_FATHI }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_FATHI }}/book_shop:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_FATHI }}/book_shop:${{ github.sha }}