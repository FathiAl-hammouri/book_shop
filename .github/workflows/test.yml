name: Test Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build artifact from source
        run: |
          pip install -r requirements.txt
          python manage.py collectstatic --noinput
          tar -czf app-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='*.pyc' \
            .

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/book_shop:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/book_shop:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/book_shop:latest

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book_shop:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book_shop:latest